version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns: ["*"]
    ignore:
      # Dependabot treats v0.11.0.1 as newer than v0.11.0.1-1; it's a year older
      - dependency-name: "https://github.com/shellcheck-py/shellcheck-py"
        versions: ["v0.11.0.1", "0.11.0.1"]
