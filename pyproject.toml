[project]
name = "py-100-days-of-learning"
version = "0.1.0"
description = "100 days of learning Python"
authors = [
	{ name = "Nicholas Lawrence", email = "nlawren@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "rich>=13.9.4",
    "ruff>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
# enable preview features
preview = true
required-version = ">=0.16.0"
line-length = 88

[tool.ruff.lint]
select = [
    "F", "W", "E", "I", "UP", "C4", "ISC", "ICN",
    "RET", "SIM", "TID", "TC", "PTH",
"DTZ",      # naive datetimes
"S",        # flake8-bandit security checks
]
ignore = [
    "E265",     # Using Angela's sample files with multiple # characters
    "E266",     # Using Angela's sample files with multiple # characters
    "E501",     # handled structurally by the formatter
    "ISC001",   # conflicts with the formatter
    "RET505",   # while learning in this course
    "S311",     # using random numbers in this course
    "S607",     # partial executable paths — unavoidable with az/terraform CLI calls
    "SIM108",   # Using Angela's files using if then elif
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# setup for a learning set of exercises
"src/day*/**" = ["S605", "S607", "T201"]
"tests/**" = [
    "S101",     # assert is the point of a test
    "S105",     # dummy credentials in fixtures
    "S106",
    "PLR2004",  # magic values in assertions
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.uv]
exclude-newer = "1 week"
